<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-receipt {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .slide-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface overflow-hidden h-screen flex flex-col">
<!-- Background Shader -->

<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/70 dark:bg-surface-container-low/70 backdrop-blur-xl shadow-[0px_12px_32px_-4px_rgba(0,0,0,0.08)]">
<div class="flex justify-between items-center px-gutter h-16 w-full max-w-7xl mx-auto">
<span class="font-headline-lg text-headline-lg font-black tracking-tighter text-primary">OBEY</span>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-primary/5 transition-colors active:scale-95 duration-200">

</button>
</div>
</header>
<main class="relative z-10 flex-grow flex flex-col items-center justify-start pt-32 px-gutter overflow-y-auto pb-32">
<!-- Animated Checkmark Section -->
<div class="mb-lg fade-in">

</div>

<div class="text-center mb-xl fade-in" style="animation-delay: 0.2s;">

<p class="font-body-lg text-body-lg text-on-surface-variant font-medium">Wallet Funding</p>
</div>
<!-- Glassmorphic Receipt Card -->
<div class="glass-receipt w-full max-w-md rounded-28px p-lg shadow-[0px_12px_32px_-4px_rgba(0,0,0,0.08)] slide-up" style="animation-delay: 0.4s;">
<div class="space-y-md">
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant">Transaction ID</span>
<span class="font-body-md text-body-md font-semibold text-on-surface select-all">OBY-982347102X</span>
</div>
<div class="border-b border-outline-variant opacity-30"></div>
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant">Date</span>

</div>
<div class="border-b border-outline-variant opacity-30"></div>
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant">Fee</span>

</div>
<div class="border-b border-outline-variant opacity-30"></div>
<div class="flex justify-between items-center">

<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
<span class="font-body-md text-body-md font-semibold text-on-surface">Completed</span>
</div>
</div>
</div>

<button class="w-full h-[56px] bg-primary text-on-primary font-semibold rounded-xl flex items-center justify-center gap-sm hover:opacity-90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">download</span>
                    Download PDF
                </button>
<button class="w-full h-[56px] bg-transparent border border-outline text-on-surface font-semibold rounded-xl flex items-center justify-center gap-sm hover:bg-surface-variant/50 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">share</span>
                    Share Receipt
                </button>
</div>
</div>
<div class="mt-xl fade-in" style="animation-delay: 0.6s;">
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-xs">
                Funds have been successfully credited to your main OBEY wallet.
            </p>
</div>
</main>
<!-- Simple Bottom Section (Non-nav) -->
<div class="fixed bottom-8 left-0 w-full z-20 flex justify-center px-gutter">
<button class="font-label-md text-label-md text-primary font-bold hover:underline cursor-pointer" onclick="window.location.reload()">
            Done
        </button>
</div>
<script>
        // Micro-interaction for feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
