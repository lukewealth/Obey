</section>
<!-- Main Transaction Card -->
<div class="glass-card rounded-2xl p-lg space-y-2xl">
<!-- Step 1: Network Selection -->
<div class="space-y-md" id="step-1">
<div class="flex items-center gap-2">
<span class="w-6 h-6 rounded-full bg-primary text-white text-[12px] flex items-center justify-center font-bold">1</span>
<label class="font-label-md text-label-md text-on-surface">Select Network Provider</label>
</div>
<div class="grid grid-cols-4 gap-sm">
<!-- Network Item -->
<button class="network-grid-item flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl transition-all hover:bg-surface-container-low active:scale-95 group" onclick="selectNetwork(this, 'MTN')">
<div class="w-10 h-10 rounded-lg bg-[#FFCC00] mb-xs flex items-center justify-center overflow-hidden">
<span class="text-[10px] font-black text-black">MTN</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-active:text-primary">MTN</span>
</button>
<button class="network-grid-item flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl transition-all hover:bg-surface-container-low active:scale-95 group" onclick="selectNetwork(this, 'Airtel')">
<div class="w-10 h-10 rounded-lg bg-[#FF0000] mb-xs flex items-center justify-center overflow-hidden">
<span class="text-[10px] font-black text-white">Airtel</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-active:text-primary">Airtel</span>
</button>
<button class="network-grid-item flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl transition-all hover:bg-surface-container-low active:scale-95 group" onclick="selectNetwork(this, 'Glo')">
<div class="w-10 h-10 rounded-lg bg-[#009245] mb-xs flex items-center justify-center overflow-hidden">
<span class="text-[10px] font-black text-white">Glo</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-active:text-primary">Glo</span>
</button>
<button class="network-grid-item flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl transition-all hover:bg-surface-container-low active:scale-95 group" onclick="selectNetwork(this, '9Mobile')">
<div class="w-10 h-10 rounded-lg bg-[#2D4F1E] mb-xs flex items-center justify-center overflow-hidden">
<span class="text-[10px] font-black text-white">9Mob</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-active:text-primary">9Mobile</span>
</button>
</div>
</div>
<!-- Step 2: Phone Number -->
<div class="space-y-md" id="step-2">

<span class="material-symbols-outlined">contact_page</span>

</div>

<button class="amount-chip py-3 border border-outline-variant rounded-xl font-label-md text-label-md hover:border-primary transition-all" onclick="selectAmount(this, 200)">₦200</button>
<button class="amount-chip py-3 border border-outline-variant rounded-xl font-label-md text-label-md hover:border-primary transition-all" onclick="selectAmount(this, 500)">₦500</button>
<button class="amount-chip py-3 border border-outline-variant rounded-xl font-label-md text-label-md hover:border-primary transition-all" onclick="selectAmount(this, 1000)">₦1,000</button>
<button class="amount-chip py-3 border border-outline-variant rounded-xl font-label-md text-label-md hover:border-primary transition-all" onclick="selectAmount(this, 2000)">₦2,000</button>
<button class="amount-chip py-3 border border-outline-variant rounded-xl font-label-md text-label-md hover:border-primary transition-all" onclick="selectAmount(this, 5000)">₦5,000</button>
</div>
<div class="relative mt-md">
<input class="w-full h-[48px] bg-[#F1F5F9] border-transparent focus:border-primary focus:ring-0 rounded-xl px-lg font-body-md text-body-md" placeholder="Enter Other Amount" type="number"/>
</div>
</div>

<div class="pt-lg">

                    Review &amp; Pay
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center mt-md font-label-sm text-label-sm text-on-surface-variant">Daily recharge limit: ₦50,000</p>
</div>
</div>
<!-- Visual Promotion / Context Image -->
<div class="mt-2xl rounded-2xl overflow-hidden relative h-48 group">
<img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A clean high-key photograph of a sleek modern smartphone displaying a financial application with bright blue and white UI elements. The phone rests on a white marble desk next to a minimal glass of water and a professional leather notebook. Soft morning sunlight filters through a window creating long gentle shadows and a serene high-trust corporate atmosphere." src="https://lh3.googleusercontent.com/aida/AP1WRLts_tfg20ufNlFMoViKDhDRbbfRUrxkjFUHhnfhyXnbRjP0qYKJJOPifKf9-hsxVhAjIFwFWrCXdYLvExZoZi6vvokHnZ4XWj23GHK87S_bVNDQajnHGgUFj9e_OEdNcyYD9XJuKWr191c158UCkh7BbMAZAg8f6DnWxK5K2dVswI-qdBR90k7DNXZPO-zkxXG_cb9nmRpoeOpCVlBkc03HqGd6YD1u1kqe5Z-pNUiMvobbmOqFGSW4QeI"/>

<p class="text-white/80 font-body-md text-body-md">On every airtime purchase this month.</p>
</div>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-surface border-t border-outline-variant/10 flex justify-around items-center px-gutter-mobile pb-4 pt-2">

</button>

</button>

<span class="material-symbols-outlined">swap_vert</span>
<span class="font-label-sm text-label-sm">Trade</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        function selectNetwork(element, name) {
            document.querySelectorAll('.network-grid-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            console.log("Selected Network:", name);
        }

        function selectAmount(element, amount) {
            document.querySelectorAll('.amount-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            console.log("Selected Amount:", amount);
        }

        // Simple micro-interaction for focus states
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary/20');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary/20');
            });
        });
    </script>
