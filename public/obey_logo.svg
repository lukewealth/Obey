<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ringGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="dogGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
    <linearGradient id="catGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer ring / crescent hand shape -->
  <path d="M 256 30 
           A 226 226 0 1 1 380 420 
           Q 340 440 310 410 
           Q 350 390 370 360 
           Q 330 370 300 340 
           Q 340 330 360 300 
           A 190 190 0 1 0 256 66 Z" 
        fill="url(#ringGrad)" filter="url(#shadow)"/>

  <!-- Dog body (white/cream) -->
  <path d="M 170 200 
           C 170 140, 220 100, 280 100 
           C 320 100, 350 120, 370 150 
           C 385 175, 390 200, 385 230 
           C 380 260, 360 280, 330 290 
           C 300 300, 260 300, 230 290 
           C 200 280, 180 260, 175 240 
           C 170 220, 170 210, 170 200 Z" 
        fill="url(#dogGrad)"/>

  <!-- Dog ear (black) -->
  <ellipse cx="210" cy="175" rx="38" ry="55" fill="#1a1a1a" transform="rotate(-15 210 175)"/>

  <!-- Dog nose -->
  <ellipse cx="365" cy="175" rx="14" ry="11" fill="#1a1a1a"/>

  <!-- Dog smile -->
  <path d="M 340 195 Q 355 215 370 195" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Dog eye (closed/happy) -->
  <path d="M 310 165 Q 320 155 330 165" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Cat body (black) -->
  <path d="M 200 290 
           C 200 260, 220 240, 250 235 
           C 270 232, 290 240, 310 255 
           C 330 270, 345 290, 350 310 
           C 355 335, 345 360, 325 375 
           C 305 390, 275 395, 250 390 
           C 225 385, 205 370, 198 350 
           C 192 330, 195 310, 200 290 Z" 
        fill="url(#catGrad)"/>

  <!-- Cat left ear -->
  <path d="M 225 250 L 215 210 L 245 235 Z" fill="#1a1a1a"/>
  <!-- Cat right ear -->
  <path d="M 275 245 L 290 205 L 300 240 Z" fill="#1a1a1a"/>

  <!-- Cat nose -->
  <ellipse cx="340" cy="300" rx="8" ry="6" fill="#333"/>

  <!-- Cat whiskers -->
  <line x1="310" y1="305" x2="280" y2="310" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="310" y1="312" x2="278" y2="318" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="312" y1="298" x2="282" y2="295" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cat eye (closed/happy) -->
  <path d="M 315 285 Q 325 277 335 285" stroke="#ccc" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Hand/crescent at bottom right -->
  <path d="M 310 410 
           Q 340 430 370 410 
           Q 390 395 400 370 
           Q 380 385 360 390 
           Q 370 370 375 350 
           Q 355 365 340 375 
           Q 350 355 350 340 
           Q 330 355 315 365 
           Q 320 345 318 330 
           Q 300 350 290 365 
           Q 270 390 280 410 
           Q 290 425 310 410 Z" 
        fill="url(#ringGrad)"/>
</svg>
